<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyBot - Parent & Control Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
            margin-bottom: 20px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        button.disconnect {
            background-color: #f44336;
        }
        button.disconnect:hover {
            background-color: #d32f2f;
        }
        .hidden {
            display: none;
        }
        .status-box {
            font-weight: bold;
            margin-top: 10px;
        }
        .status-disconnected { color: #f44336; }
        .status-connected { color: #4CAF50; }
        input, select {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>

    <!-- SECTION 1: BLUETOOTH CONNECTION GATEWAY -->
    <div class="card" id="auth-card">
        <h2>StudyBot Security Gate</h2>
        <p>You must connect to StudyBot via Bluetooth to unlock the Parent Dashboard.</p>
        <button id="connect-btn" onclick="connectBluetooth()">Connect via Bluetooth</button>
        <p class="status-box status-disconnected" id="ble-status">Status: Disconnected</p>
    </div>

    <!-- SECTION 2: PARENT'S DASHBOARD (LOCKED BY DEFAULT) -->
    <div class="card hidden" id="dashboard-card">
        <h2>StudyBot Parent's Dashboard</h2>
        <p class="status-box status-connected">Access Granted: Device Linked Successfully!</p>
        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
        
        <h3>Wi-Fi Provisioning Setup</h3>
        <p>Send Wi-Fi credentials to StudyBot:</p>
        <input type="text" id="wifi-ssid" placeholder="Enter Wi-Fi SSID"><br>
        <input type="password" id="wifi-pass" placeholder="Enter Wi-Fi Password"><br>
        <button onclick="sendWiFiCredentials()">Save & Connect Wi-Fi</button>

        <h3 style="margin-top: 30px;">Study Timer Settings</h3>
        <button onclick="triggerTimer(25)">Start 25-Min Pomodoro</button>
        <br><br>
        <button class="disconnect" onclick="disconnectBluetooth()">Disconnect Device</button>
    </div>

<script>
    // BLE Service and Characteristic UUIDs matching your ESP32 code
    const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const CHARACTERISTIC_UUID_RX = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
    const CHARACTERISTIC_UUID_TX = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

    let bluetoothDevice = null;
    let rxCharacteristic = null;

    async function connectBluetooth() {
        try {
            document.getElementById("ble-status").innerText = "Status: Scanning...";
            
            // Request Bluetooth Device matching StudyBot's BLE name
            bluetoothDevice = await navigator.bluetooth.requestDevice({
                filters: [{ name: 'StudyBot_BLE' }],
                optionalServices: [SERVICE_UUID]
            });

            bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

            document.getElementById("ble-status").innerText = "Status: Connecting to GATT...";
            const server = await bluetoothDevice.gatt.connect();

            document.getElementById("ble-status").innerText = "Status: Finding Services...";
            const service = await server.getPrimaryService(SERVICE_UUID);

            rxCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_RX);

            // SUCCESS: Connected! Hide auth card and reveal Parent Dashboard
            document.getElementById("ble-status").innerText = "Status: Connected";
            document.getElementById("auth-card").classList.add("hidden");
            document.getElementById("dashboard-card").classList.remove("hidden");

        } catch (error) {
            console.error("Bluetooth connection failed: ", error);
            document.getElementById("ble-status").innerText = "Status: Connection Failed / Cancelled";
        }
    }

    async function sendWiFiCredentials() {
        const ssid = document.getElementById("wifi-ssid").value;
        const password = document.getElementById("wifi-pass").value;

        if (!ssid || !password) {
            alert("Please enter both SSID and Password.");
            return;
        }

        const payload = JSON.stringify({ ssid: ssid, password: password });
        
        if (rxCharacteristic) {
            try {
                const encoder = new TextEncoder();
                await rxCharacteristic.writeValue(encoder.encode(payload));
                alert("Wi-Fi credentials sent to StudyBot successfully!");
            } catch (error) {
                console.error("Error sending data: ", error);
                alert("Failed to send credentials over BLE.");
            }
        }
    }

    async function triggerTimer(mins) {
        if (rxCharacteristic) {
            try {
                const encoder = new TextEncoder();
                await rxCharacteristic.writeValue(encoder.encode("TIMER:" + mins));
                alert("Triggered " + mins + "-minute timer on StudyBot!");
            } catch (error) {
                console.error("Error sending timer command: ", error);
            }
        }
    }

    function disconnectBluetooth() {
        if (bluetoothDevice && bluetoothDevice.gatt.connected) {
            bluetoothDevice.gatt.disconnect();
        }
        onDisconnected();
    }

    function onDisconnected() {
        // Lock the dashboard back up and show the gateway card
        document.getElementById("auth-card").classList.remove("hidden");
        document.getElementById("dashboard-card").classList.add("hidden");
        document.getElementById("ble-status").innerText = "Status: Disconnected";
        bluetoothDevice = null;
        rxCharacteristic = null;
    }
</script>

</body>
</html>
